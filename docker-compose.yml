services:
  finanzas:
    build: .
    container_name: finanzas-app
    # Sin puerto fijo acá a propósito: Docker Compose CONCATENA (no
    # reemplaza) las listas de puertos entre este archivo y un
    # docker-compose.override.yml -- si acá hubiera un puerto fijo, el
    # contenedor terminaría escuchando en dos puertos a la vez. Cada
    # carpeta (dev, despliegue) define el suyo en su propio override
    # (ver docker-compose.override.yml, no versionado).
    environment:
      - MODO_LABEL=Local   # la carpeta de despliegue lo pisa a "Online" en su propio override
    volumes:
      - ./data:/app/data
      # dashboard_finanzas.html es un único archivo estático que el
      # navegador carga y le pide sus datos a /api/dashboard-data por su
      # cuenta -- este montaje es solo para poder editarlo sin
      # reconstruir la imagen, no para "regenerar" nada (eso ya no existe).
      - ./dashboard:/app/dashboard
    restart: unless-stopped   # si Docker se reinicia o el contenedor se cae, vuelve a levantarse solo
