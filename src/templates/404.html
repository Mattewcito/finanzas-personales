<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/favicon.svg') }}">
<!-- Tema fijo en claro (toggle desactivado; ignoramos localStorage y OS),
     igual que base.html -- si no, un 'finanzas_theme: dark' guardado de
     antes dejaba esta pantalla oscura y el resto de la app clara. -->
<script>document.documentElement.setAttribute('data-theme','light');</script>
<title>Página no encontrada · Cuadre</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<style>
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; padding: 24px;
  }
  .error-card{
    text-align:center; max-width: 380px;
  }
  .error-code{
    font-size: 72px; font-weight: 800; color: var(--brand);
    line-height: 1; margin-bottom: 8px; letter-spacing: -2px;
  }
  .error-card h1{ font-size: 20px; margin: 0 0 10px; }
  .error-card p{ color: var(--text-muted); font-size: 14px; margin: 0 0 28px; line-height: 1.6; }
  .btn-volver{
    display: inline-block; padding: 11px 28px; border-radius: 10px;
    background: var(--brand); color: #fff; font-weight: 700; font-size: 13.5px;
    text-decoration: none; transition: filter .15s ease;
  }
  .btn-volver:hover{ filter: brightness(1.08); }
</style>
</head>
<body>
<div class="error-card">
  <div class="error-code">404</div>
  <h1>Página no encontrada</h1>
  <p>La página que buscas no existe o fue movida.<br>Revisá la URL o volvé al inicio.</p>
  <a href="/" class="btn-volver">Ir al inicio</a>
</div>
</body>
</html>
