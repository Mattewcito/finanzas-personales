{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block head %}
<style>
  /* El ícono "mi perfil" (fixed, arriba a la derecha en TODAS las
     páginas -- ver base.html) se superponía con el propio encabezado
     del dashboard, que usa esa misma esquina para el rango de fechas y
     los filtros de año/mes. Se reserva un margen arriba SOLO en esta
     página para que nunca se toquen, con el mismo patrón que ya usa
     base.html para la barra inferior en celular (padding + iframe con
     altura ajustada por calc()). */
  .app-main{ padding-top: 60px; }
  .app-main iframe{ height: calc(100vh - 60px) !important; }
  @media (max-width: 720px){
    .app-main iframe{ height: calc(100vh - 60px - 62px) !important; }
  }
</style>
{% endblock %}
{% block content %}
<iframe src="/vista/dashboard" style="width:100%; border:0; display:block;"></iframe>
{% endblock %}
