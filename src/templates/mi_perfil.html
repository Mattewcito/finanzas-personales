{% extends "base.html" %}
{% block title %}Mi perfil · Cuadre{% endblock %}

{% block content %}
<div class="page-wrap" style="max-width: 640px;">

  <div class="page-header">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true" style="vertical-align:middle; margin-right:8px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Mi perfil</h1>
    <p>Actualiza tu nombre, tu usuario o tu contraseña. Deja la contraseña en blanco si no quieres cambiarla.</p>
  </div>

  <div class="card" style="margin-top: 26px;">
    <form id="formPerfil">
      <label class="field-label">Nombre de usuario (para iniciar sesión)</label>
      <input type="text" name="username" class="field-input" value="{{ cuenta.username }}" required>

      <label class="field-label">Nombre a mostrar en la app</label>
      <input type="text" name="nombre" class="field-input" value="{{ cuenta.nombre_mostrado }}" required>

      <label class="field-label">Nueva contraseña (opcional)</label>
      <input type="password" name="password" class="field-input" placeholder="Dejar en blanco para no cambiarla" minlength="4">

      <button type="submit" class="btn-primary" id="btnGuardar">Guardar cambios</button>
    </form>

    <div id="resultado" class="result-box" style="display:none;"></div>
  </div>
</div>

<script>
document.getElementById('formPerfil').addEventListener('submit', async (e) => {
  e.preventDefault();
  const datos = new FormData(e.target);
  const resultado = document.getElementById('resultado');
  const btn = document.getElementById('btnGuardar');

  resultado.style.display = 'block';
  resultado.className = 'result-box loading';
  resultado.textContent = 'Guardando...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/actualizar-perfil', { method: 'POST', body: datos });
    const json = await res.json();
    resultado.style.display = 'none';
    if (!res.ok || !json.ok) {
      await mostrarAlertaApp('error', '❌ ' + (json.error || 'Error desconocido'));
      return;
    }
    await mostrarAlertaApp('ok', '✅ Perfil actualizado.');
    e.target.querySelector('[name="password"]').value = '';
  } catch (err) {
    resultado.style.display = 'none';
    await mostrarAlertaApp('error', '❌ No se pudo conectar con el servidor.');
  } finally {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
