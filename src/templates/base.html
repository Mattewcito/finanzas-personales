<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{% block title %}Finanzas Personales{% endblock %}</title>
<style>
  :root{
    --bg: #090c13;
    --bg-soft: #0d111b;
    --card-solid: #131928;
    --card-border: rgba(255,255,255,0.07);
    --card-hover: #171e30;
    --text: #e7ebf5;
    --text-dim: #8d96ab;
    --text-faint: #5b6379;
    --accent: #7c6cfb;
    --accent-2: #38bdf8;
    --sidebar-w: 226px;
    --sidebar-w-collapsed: 68px;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app-shell{ display:flex; min-height:100vh; }

  .app-sidebar{
    width: var(--sidebar-w);
    flex-shrink:0;
    background: var(--bg-soft);
    border-right: 1px solid var(--card-border);
    display:flex; flex-direction:column;
    position: sticky; top:0; align-self:flex-start; height:100vh;
    transition: width .18s ease;
    overflow: hidden;
  }
  .app-sidebar.collapsed{ width: var(--sidebar-w-collapsed); }

  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding: 18px 16px;
    border-bottom: 1px solid var(--card-border);
    position: relative;
    flex-shrink:0;
  }
  .sidebar-brand .logo{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .sidebar-brand span{ font-weight:700; font-size:14.5px; white-space:nowrap; }
  .app-sidebar.collapsed .sidebar-brand span{ display:none; }

  .sidebar-toggle{
    position:absolute; right:-12px; top:22px;
    width:24px; height:24px; border-radius:50%;
    background: var(--card-solid); border:1px solid var(--card-border);
    color: var(--text-dim); cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1;
  }
  .sidebar-toggle:hover{ color:#fff; background:var(--card-hover); }

  .sidebar-nav{ flex:1; padding: 14px 10px; overflow-y:auto; overflow-x:hidden; }
  .sidebar-nav a{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; margin-bottom:4px; border-radius:9px;
    color: var(--text-dim); text-decoration:none; font-size:13.5px;
    white-space:nowrap;
  }
  .sidebar-nav a svg{ width:18px; height:18px; flex-shrink:0; color: inherit; }
  .sidebar-nav a:hover{ background: var(--card-hover); color:#fff; }
  .sidebar-nav a.active{
    background: var(--card-solid); color: var(--accent-2); font-weight:600;
    box-shadow: inset 3px 0 0 var(--accent-2);
  }
  .app-sidebar.collapsed .sidebar-nav a{ justify-content:center; }
  .app-sidebar.collapsed .sidebar-nav a span{ display:none; }

  .sidebar-footer{
    padding: 13px 18px; border-top:1px solid var(--card-border);
    font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden;
    flex-shrink:0;
  }
  .app-sidebar.collapsed .sidebar-footer{ text-align:center; padding:13px 4px; }
  .app-sidebar.collapsed .sidebar-footer .full-text{ display:none; }
  .app-sidebar.collapsed .sidebar-footer .dot-text{ display:inline; }
  .sidebar-footer .dot-text{ display:none; }

  .app-main{ flex:1; min-width:0; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <nav class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <div class="logo">💰</div>
      <span>Finanzas</span>
      <button class="sidebar-toggle" id="sidebarToggle" title="Colapsar/expandir menú">‹</button>
    </div>

    <div class="sidebar-nav">
      <a href="/" class="{{ 'active' if activo == 'dashboard' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="/cargar-extractos" class="{{ 'active' if activo == 'cargar' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"></path>
          <path d="M7 9l5-5 5 5"></path>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
        </svg>
        <span>Cargar extractos</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <span class="full-text">Finanzas personales · local</span>
      <span class="dot-text">●</span>
    </div>
  </nav>

  <div class="app-main">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
(function(){
  const sidebar = document.getElementById('appSidebar');
  const toggle = document.getElementById('sidebarToggle');
  let colapsado = false;
  try { colapsado = localStorage.getItem('finanzas_sidebar_colapsado') === '1'; } catch(e) {}

  const aplicar = () => {
    sidebar.classList.toggle('collapsed', colapsado);
    toggle.textContent = colapsado ? '›' : '‹';
  };
  aplicar();

  toggle.addEventListener('click', () => {
    colapsado = !colapsado;
    aplicar();
    try { localStorage.setItem('finanzas_sidebar_colapsado', colapsado ? '1' : '0'); } catch(e) {}
  });
})();
</script>
</body>
</html>
