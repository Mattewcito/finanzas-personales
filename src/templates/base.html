<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Finanzas Personales{% endblock %}</title>
<style>
  :root{
    --bg: #090c13;
    --bg-soft: #0d111b;
    --card-solid: #131928;
    --card-border: rgba(255,255,255,0.07);
    --card-hover: #171e30;
    --text: #e7ebf5;
    --text-dim: #8d96ab;
    --text-faint: #5b6379;
    --accent: #7c6cfb;
    --accent-2: #38bdf8;
    --sidebar-w: 226px;
    --sidebar-w-collapsed: 68px;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app-shell{ display:flex; min-height:100vh; }

  .app-sidebar{
    width: var(--sidebar-w);
    flex-shrink:0;
    background: var(--bg-soft);
    border-right: 1px solid var(--card-border);
    display:flex; flex-direction:column;
    position: sticky; top:0; align-self:flex-start; height:100vh;
    transition: width .18s ease;
    overflow: hidden;
  }
  .app-sidebar.collapsed{ width: var(--sidebar-w-collapsed); }

  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding: 18px 16px;
    border-bottom: 1px solid var(--card-border);
    position: relative;
    flex-shrink:0;
  }
  .sidebar-brand .logo{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .sidebar-brand span{ font-weight:700; font-size:14.5px; white-space:nowrap; }
  .app-sidebar.collapsed .sidebar-brand span{ display:none; }

  .sidebar-toggle{
    position:absolute; right:-12px; top:22px;
    width:24px; height:24px; border-radius:50%;
    background: var(--card-solid); border:1px solid var(--card-border);
    color: var(--text-dim); cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1;
  }
  .sidebar-toggle:hover{ color:#fff; background:var(--card-hover); }

  .sidebar-nav{ flex:1; padding: 14px 10px; overflow-y:auto; overflow-x:hidden; }
  .sidebar-nav a{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; margin-bottom:4px; border-radius:9px;
    color: var(--text-dim); text-decoration:none; font-size:13.5px;
    white-space:nowrap;
  }
  .sidebar-nav a svg{ width:18px; height:18px; flex-shrink:0; color: inherit; }
  .sidebar-nav a:hover{ background: var(--card-hover); color:#fff; }
  .sidebar-nav a.active{
    background: var(--card-solid); color: var(--accent-2); font-weight:600;
    box-shadow: inset 3px 0 0 var(--accent-2);
  }
  .app-sidebar.collapsed .sidebar-nav a{ justify-content:center; }
  .app-sidebar.collapsed .sidebar-nav a span{ display:none; }

  .sidebar-footer{
    padding: 13px 18px; border-top:1px solid var(--card-border);
    font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden;
    flex-shrink:0;
  }
  .app-sidebar.collapsed .sidebar-footer{ text-align:center; padding:13px 4px; }
  .app-sidebar.collapsed .sidebar-footer .full-text{ display:none; }
  .app-sidebar.collapsed .sidebar-footer .dot-text{ display:inline; }
  .sidebar-footer .dot-text{ display:none; }
  .switcher-select{
    width:100%; padding:5px 8px; font-size:11.5px; font-family:inherit;
    background: var(--card-solid); color: var(--text);
    border:1px solid var(--card-border); border-radius:6px;
  }

  .app-main{ flex:1; min-width:0; }

  /* ---- Estilos compartidos por las páginas de formulario (Registrar
     movimiento, Cargar extractos) -- un solo lugar, no duplicado ---- */
  .page-wrap{ max-width: 1200px; margin: 0 auto; padding: 32px 28px 60px; }
  .page-header h1{ font-size: 24px; margin: 0 0 6px; }
  .page-header p{ margin:0; color: var(--text-dim); font-size: 13.5px; max-width: 640px; }

  .card{
    background: linear-gradient(180deg, var(--card-solid), #10141f);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
  }

  .field-label{ display:block; font-size: 12.5px; color: var(--text-dim); margin: 18px 0 6px; font-weight:600; }
  .field-label:first-child{ margin-top:0; }
  .field-select, .field-input{
    width:100%; padding: 10px 12px; font-size: 13.5px;
    background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 10px;
    font-family: inherit;
  }
  .field-select:focus, .field-input:focus{ outline:none; border-color: var(--accent); }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn-primary{
    margin-top: 20px; padding: 11px 24px; border-radius: 10px; border:none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff; font-weight:700; font-size:13.5px; cursor:pointer;
    font-family: inherit;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }

  .result-box{
    margin-top: 18px; padding: 12px 14px; border-radius: 10px;
    font-size: 13px; border-left: 3px solid var(--text-faint);
    background: var(--bg-soft); white-space:pre-line;
  }
  .result-box.ok{ border-left-color:#34d399; color:#34d399; }
  .result-box.error{ border-left-color:#f87171; color:#f87171; }
  .result-box.loading{ border-left-color: var(--accent-2); color: var(--text-dim); }

  /* Pantallas chicas (celular/tablet en vertical): el menú lateral pasa a
     ser una barra inferior fija, tipo app nativa -- nada de sidebar de
     226px comiéndose la pantalla. */
  @media (max-width: 720px){
    .app-shell{ flex-direction: column; }
    .app-sidebar, .app-sidebar.collapsed{
      width: 100%; height: auto; flex-direction: row;
      position: fixed; bottom: 0; left: 0; top: auto;
      border-right: none; border-top: 1px solid var(--card-border);
      z-index: 100;
    }
    .sidebar-brand, .sidebar-footer{ display: none; }
    .sidebar-nav{
      display: flex; flex-direction: row; padding: 6px 8px;
      justify-content: space-around; overflow: visible;
    }
    .sidebar-nav a{
      flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 14px; font-size: 10.5px; margin-bottom: 0;
    }
    .sidebar-nav a span{ display: block !important; white-space: nowrap; }
    .sidebar-nav a.nav-cargar{ display: none !important; } /* subir archivos desde el celular no es el caso de uso -- solo queda Dashboard */
    .app-main{ padding-bottom: 62px; } /* deja ver el contenido por encima de la barra */
    .app-main iframe{ height: calc(100vh - 62px) !important; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <nav class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <div class="logo">💰</div>
      <span>Finanzas</span>
      <button class="sidebar-toggle" id="sidebarToggle" title="Colapsar/expandir menú">‹</button>
    </div>

    <div class="sidebar-nav">
      <a href="/" class="{{ 'active' if activo == 'dashboard' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span>Dashboard</span>
      </a>
      <a href="/registrar" class="{{ 'active' if activo == 'registrar' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        <span>Registrar movimiento</span>
      </a>
      <a href="/cargar-extractos" class="nav-cargar {{ 'active' if activo == 'cargar' else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"></path>
          <path d="M7 9l5-5 5 5"></path>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
        </svg>
        <span>Cargar extractos</span>
      </a>
    </div>

    <div class="sidebar-footer">
      {% if usuario_rol == 'admin' and usuarios_disponibles|length > 1 %}
      <form method="post" action="/cambiar-vista" class="full-text" style="margin-bottom:8px;">
        <label style="display:block; font-size:10.5px; color:var(--text-faint); margin-bottom:3px;">Viendo perfil de</label>
        <select name="usuario_id" class="switcher-select" onchange="this.form.submit()">
          {% for u in usuarios_disponibles %}
          <option value="{{ u.id }}" {{ 'selected' if u.id == viendo_id else '' }}>{{ u.nombre_mostrado }}</option>
          {% endfor %}
        </select>
      </form>
      {% endif %}
      <span class="full-text" style="display:block;">{{ usuario_nombre }} · {{ modo }}</span>
      <a href="/logout" class="full-text" style="display:block; margin-top:4px; color:var(--text-faint); text-decoration:underline;">Cerrar sesión</a>
      <span class="dot-text">●</span>
    </div>
  </nav>

  <div class="app-main">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
(function(){
  const sidebar = document.getElementById('appSidebar');
  const toggle = document.getElementById('sidebarToggle');
  let colapsado = false;
  try { colapsado = localStorage.getItem('finanzas_sidebar_colapsado') === '1'; } catch(e) {}

  const aplicar = () => {
    sidebar.classList.toggle('collapsed', colapsado);
    toggle.textContent = colapsado ? '›' : '‹';
  };
  aplicar();

  toggle.addEventListener('click', () => {
    colapsado = !colapsado;
    aplicar();
    try { localStorage.setItem('finanzas_sidebar_colapsado', colapsado ? '1' : '0'); } catch(e) {}
  });
})();
</script>
</body>
</html>
