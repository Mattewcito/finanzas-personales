<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function(){
  try {
    var t = localStorage.getItem('finanzas_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}
})();
</script>
<title>Ingresar — Finanzas</title>
<style>
  /* Mismos tokens que base.html (reskin 2026-09-11) -- ver ahí el
     comentario completo sobre el patrón de los 4 bloques de tema. */
  :root{
    --bg: #090c13; --card-solid: #131928; --card-border: rgba(255,255,255,0.08);
    --card-hover: #171e30; --text: #eef1f8; --text-dim: #9aa3b8; --text-faint: #6b7488;
    --accent: #5b6472; --accent-2: #c68a4e; --red: #fb7185;
    --shadow-card: 0 24px 60px -24px rgba(0,0,0,0.55);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #f6f7fa; --card-solid: #ffffff; --card-border: rgba(15,23,42,0.10);
      --card-hover: #f1f3f8; --text: #12151c; --text-dim: #5b6472; --text-faint: #6a7285;
      --accent-2: #9c6530; --red: #c81e42;
      --shadow-card: 0 24px 60px -30px rgba(30,41,59,0.28), 0 1px 3px rgba(30,41,59,0.08);
    }
  }
  :root[data-theme="light"]{
    --bg: #f6f7fa; --card-solid: #ffffff; --card-border: rgba(15,23,42,0.10);
    --card-hover: #f1f3f8; --text: #12151c; --text-dim: #5b6472; --text-faint: #6a7285;
    --accent-2: #9c6530; --red: #c81e42;
    --shadow-card: 0 24px 60px -30px rgba(30,41,59,0.28), 0 1px 3px rgba(30,41,59,0.08);
  }
  :root[data-theme="dark"]{
    --bg: #090c13; --card-solid: #131928; --card-border: rgba(255,255,255,0.08);
    --card-hover: #171e30; --text: #eef1f8; --text-dim: #9aa3b8; --text-faint: #6b7488;
    --accent-2: #c68a4e; --red: #fb7185;
    --shadow-card: 0 24px 60px -24px rgba(0,0,0,0.55);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    transition: background-color .18s ease, color .18s ease;
  }
  .theme-toggle-fab{
    position:fixed; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background: var(--card-solid); border:1px solid var(--card-border); color: var(--text-dim);
    transition: background-color .15s ease, color .15s ease;
  }
  .theme-toggle-fab:hover{ background: var(--card-hover); color: var(--text); }
  .theme-toggle-fab svg{ width:17px; height:17px; }
  .theme-toggle-fab .icon-luna{ display:none; }
  :root[data-theme="light"] .theme-toggle-fab .icon-sol{ display:none; }
  :root[data-theme="light"] .theme-toggle-fab .icon-luna{ display:block; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) .theme-toggle-fab .icon-sol{ display:none; }
    :root:not([data-theme="dark"]) .theme-toggle-fab .icon-luna{ display:block; }
  }

  .login-card{
    width: 100%; max-width: 340px; padding: 32px 28px;
    background: var(--card-solid);
    border: 1px solid var(--card-border); border-radius: 18px;
    box-shadow: var(--shadow-card);
    animation: loginCardIn .22s cubic-bezier(.2,.9,.3,1.1);
    transition: background-color .18s ease, border-color .18s ease;
  }
  @keyframes loginCardIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .login-card .logo{
    width:44px; height:44px; border-radius:12px; margin-bottom:16px;
    background: var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .login-card .logo svg{ width:22px; height:22px; }
  .login-card h1{ font-size:18px; margin:0 0 4px; }
  .login-card p{ margin:0 0 22px; color:var(--text-dim); font-size:12.5px; }
  .field-label{ display:block; font-size: 12.5px; color: var(--text-dim); margin: 14px 0 6px; font-weight:600; }
  .field-label:first-of-type{ margin-top:0; }
  .field-input{
    width:100%; padding: 10px 12px; font-size: 13.5px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--card-border); border-radius: 10px; font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field-input:focus{
    outline:none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .btn-primary{
    width:100%; margin-top: 20px; padding: 11px 24px; border-radius: 10px; border:none;
    background: var(--accent);
    color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; font-family: inherit;
    transition: filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary:active{ transform: translateY(1px); }
  .error-box{
    margin-top:16px; padding:10px 12px; border-radius:8px; font-size:12.5px;
    background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red);
    border-left:3px solid var(--red);
    animation: resultBoxIn .16s ease;
  }
  @keyframes resultBoxIn{ from{ opacity:0; transform:translateY(-3px); } to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<button type="button" class="theme-toggle-fab" id="themeToggleFab" title="Cambiar tema" aria-label="Cambiar tema">
  <svg class="icon-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
  </svg>
  <svg class="icon-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
  </svg>
</button>
<div class="login-card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
    </svg>
  </div>
  <h1>Finanzas Personales</h1>
  <p>Ingresá con tu usuario y contraseña.</p>

  <form method="post" action="/login">
    <label class="field-label">Usuario</label>
    <input type="text" name="username" class="field-input" autocomplete="username" required autofocus>

    <label class="field-label">Contraseña</label>
    <input type="password" name="password" class="field-input" autocomplete="current-password" required>

    <button type="submit" class="btn-primary">Ingresar</button>
  </form>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}
</div>
<script>
(function(){
  const boton = document.getElementById('themeToggleFab');
  function temaActual() {
    const guardado = document.documentElement.getAttribute('data-theme');
    if (guardado === 'light' || guardado === 'dark') return guardado;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  boton.addEventListener('click', () => {
    const nuevo = temaActual() === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', nuevo);
    try { localStorage.setItem('finanzas_theme', nuevo); } catch(e) {}
  });
})();
</script>
</body>
</html>
