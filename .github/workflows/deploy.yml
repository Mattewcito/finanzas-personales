name: Deploy

# Se dispara cada vez que llega un push a master (por ejemplo, al fusionar
# un Pull Request). Corre en el runner auto-hospedado instalado en la PC
# donde vive el contenedor Docker -- no en la nube de GitHub, porque el
# contenedor y sus datos viven localmente.
#
# Corre sobre C:\finanzas-deploy -- una carpeta APARTE de la carpeta de
# trabajo, dedicada solo a esto (nunca se edita a mano). Así el "git reset
# --hard" que actualiza el código para producción nunca pisa nada que se
# esté probando en la carpeta de desarrollo. Ambas leen la misma base de
# datos real (ver docker-compose.override.yml en cada carpeta, no
# versionado).
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Actualizar el código y reconstruir el contenedor
        shell: cmd
        run: |
          cd /d "C:\finanzas-deploy"
          git fetch origin master
          git reset --hard origin/master
          docker compose up -d --build
