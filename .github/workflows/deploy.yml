name: CI/CD

# Se dispara en cada push/PR a master. El job "test" corre siempre (en la
# nube de GitHub, gratis, no necesita Docker). El job "deploy" SOLO corre
# si "test" pasó Y el evento fue un push directo a master (no en PRs) --
# corre en el runner auto-hospedado de esta PC, porque ahí vive el
# contenedor.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Correr pruebas unitarias y de integración
        run: pytest -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted

    steps:
      - name: Desplegar (con rollback automático si falla)
        # -ExecutionPolicy Bypass: la política de PowerShell de la cuenta que
        # corre el runner bloquea ejecutar scripts por defecto -- esto lo
        # evita solo para este paso, sin tocar la configuración de la PC.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\finanzas-deploy"
          $previo = git rev-parse HEAD
          Write-Host "Commit actual, guardado como respaldo: $previo"

          try {
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build

            Write-Host "Verificando que el contenedor haya arrancado bien..."
            $ok = $false
            for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 3
              try {
                $resp = Invoke-WebRequest -Uri "http://localhost:5002/health" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "El contenedor no respondio correctamente despues de desplegar." }

            Write-Host "Sincronizando el Excel (si sigue activo) con el codigo recien desplegado..."
            # El dashboard ya es dinamico (lee /api/dashboard-data en cada
            # carga, no hay nada que "regenerar"). Lo unico que le queda a
            # actualizar_dashboard.py es sincronizar finanzas.db desde el
            # Excel mientras siga siendo un canal de ingesta activo -- si ya
            # se retiro, este paso no hace nada. Best-effort: si falla, se
            # avisa pero NO se revierte el deploy (la app ya paso el health
            # check de arriba).
            try {
              docker exec -w /app/src finanzas-app-online python actualizar_dashboard.py
            } catch {
              Write-Warning "No se pudo sincronizar el Excel: $_"
            }

            Write-Host "Despliegue exitoso."
          } catch {
            Write-Host "FALLO el despliegue: $_"
            Write-Host "Revirtiendo al commit anterior: $previo"
            git reset --hard $previo
            docker compose up -d --build
            Write-Error "Se revirtio automaticamente al commit anterior por un fallo en el despliegue."
            exit 1
          }
