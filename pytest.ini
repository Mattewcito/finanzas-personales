[pytest]
# La suite vive ENTERA en tests/. Sin esto, `pytest -q` desde la raíz
# también recoge tools/qa/_toggle_test.py -- un script suelto de QA de
# 2026-09-11 cuyo nombre coincide con el glob `*_test.py` por accidente,
# y que al importarse abre un navegador real de Playwright y entra a la
# app. Eso rompe la recolección entera (ni un test llega a correr) y
# depende de que haya un contenedor levantado.
#
# Acotar `testpaths` deja `pytest -q` determinista y hace que un archivo
# de trabajo con un nombre desafortunado no pueda volver a secuestrar la
# suite. Correr un archivo puntual por ruta explícita sigue funcionando
# igual (`pytest tests/test_app_integration.py`).
testpaths = tests
